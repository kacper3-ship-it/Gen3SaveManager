name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Gen3SaveManager.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -q Gen3SaveManager.zip -d android-project

      - name: Fix invalid Kotlin const declarations
        run: |
          find android-project -type f -name '*.kt' -exec sed -i 's/const[[:space:]][[:space:]]*val/val/g' {} +

      - name: Configure Gradle for GitHub Actions
        run: |
          cat >> android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gen3SaveManager-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
